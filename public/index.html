<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Career Writer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✍️</text></svg>">
<style>
:root{--bg:#f5f6fb;--card:#fff;--text:#182033;--muted:#5d667a;--line:#dde1ec;--accent:#2f5bea;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1220;--card:#181e31;--text:#e8ebf5;--muted:#9aa3ba;--line:#2b3350;--accent:#6c8cff;--on:#0e1220}}
:root[data-theme="dark"]{--bg:#0e1220;--card:#181e31;--text:#e8ebf5;--muted:#9aa3ba;--line:#2b3350;--accent:#6c8cff;--on:#0e1220}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 16px 48px}
h1{margin:0 0 4px;font-size:1.6rem}
.sub{margin:0 0 20px;color:var(--muted)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 14px;border-radius:999px;font:inherit;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);color:var(--on);border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
label{display:block;font-weight:600;font-size:.9rem;margin:0 0 6px}
textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit}
textarea{resize:vertical}
.f{margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;background:var(--accent);color:var(--on);padding:10px 18px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.btn.alt{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}
#status{color:var(--muted);font-size:.9rem}
#out{white-space:pre-wrap;word-wrap:break-word;min-height:60px}
.hint{color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>✍️ AI Career Writer</h1>
  <p class="sub">Cover letters, sharper CV bullets, and quick summaries, written by Claude.</p>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="card">
    <div id="form"></div>
    <div class="row">
      <button class="btn" id="go">Generate</button>
      <button class="btn alt" id="stop" hidden>Stop</button>
      <span id="status"></span>
    </div>
  </div>
  <div class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:8px">
      <strong>Result</strong>
      <button class="btn alt" id="copy" hidden>Copy</button>
    </div>
    <div id="out" class="hint">Your result will appear here. Always review it and check the facts before you send it.</div>
  </div>
</main>
<script>
var MODES = {
  cover: {
    label: "Cover letter",
    fields: [
      {id: "job", label: "Job post", ph: "Paste the job ad here…", rows: 6},
      {id: "me", label: "About you", ph: "Your background, skills and key projects…", rows: 6}
    ],
    sel: {label: "Tone", opts: ["Professional", "Warm", "Confident"]}
  },
  cv: {
    label: "CV polish",
    fields: [
      {id: "role", label: "Target role", ph: "e.g. AI-focused junior developer", rows: 2},
      {id: "text", label: "Your CV bullets or summary", ph: "Paste them here…", rows: 8}
    ],
    sel: {label: "Style", opts: ["Concise", "Impact-focused"]}
  },
  sum: {
    label: "Summarizer",
    fields: [{id: "text", label: "Text to summarize", ph: "Paste an article, email or job ad…", rows: 10}],
    sel: {label: "Format", opts: ["Short (2-3 sentences)", "One paragraph", "Key points (bullets)"]}
  }
};
var HINT = "Your result will appear here. Always review it and check the facts before you send it.";
var $ = function (id) { return document.getElementById(id); };
var cur = "cover", ctrl = null;

function show(key) {
  cur = key;
  var m = MODES[key], tabs = $("tabs");
  tabs.innerHTML = "";
  Object.keys(MODES).forEach(function (k) {
    var b = document.createElement("button");
    b.className = "tab";
    b.textContent = MODES[k].label;
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", k === key ? "true" : "false");
    b.onclick = function () { show(k); };
    tabs.appendChild(b);
  });
  var html = "";
  m.fields.forEach(function (f) {
    html += '<div class="f"><label for="' + f.id + '">' + f.label + '</label><textarea id="' + f.id +
      '" rows="' + f.rows + '" placeholder="' + f.ph + '"></textarea></div>';
  });
  html += '<div class="f"><label for="sel">' + m.sel.label + '</label><select id="sel">' +
    m.sel.opts.map(function (o) { return "<option>" + o + "</option>"; }).join("") + "</select></div>";
  $("form").innerHTML = html;
  $("out").textContent = HINT;
  $("out").className = "hint";
  $("copy").hidden = true;
  $("status").textContent = "";
}

function setBusy(b) { $("go").disabled = b; $("stop").hidden = !b; }

async function generate() {
  var m = MODES[cur], v = {}, missing = false, text = "";
  m.fields.forEach(function (f) {
    v[f.id] = $(f.id).value.trim();
    if (!v[f.id]) missing = true;
  });
  if (missing) { $("status").textContent = "Please fill in every box."; return; }
  ctrl = new AbortController();
  setBusy(true);
  $("copy").hidden = true;
  $("out").className = "";
  $("out").textContent = "";
  $("status").textContent = "Thinking…";
  try {
    var r = await fetch("/api/generate", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({mode: cur, values: v, option: $("sel").value}),
      signal: ctrl.signal
    });
    if (!r.ok) throw new Error(await r.text());
    var reader = r.body.getReader(), dec = new TextDecoder();
    while (true) {
      var x = await reader.read();
      if (x.done) break;
      text += dec.decode(x.value, {stream: true});
      $("out").textContent = text;
      $("status").textContent = "Writing…";
    }
    $("status").textContent = "Done.";
  } catch (e) {
    $("status").textContent = e.name === "AbortError" ? "Stopped." : (e.message || "Something went wrong. Please try again.");
  }
  $("copy").hidden = !text;
  setBusy(false);
}

$("go").onclick = generate;
$("stop").onclick = function () { if (ctrl) ctrl.abort(); };
$("copy").onclick = function () {
  var msg = "Select the text and copy it manually.";
  try {
    navigator.clipboard.writeText($("out").textContent).then(function () { $("status").textContent = "Copied."; },
      function () { $("status").textContent = msg; });
  } catch (e) { $("status").textContent = msg; }
};
show("cover");
</script>
</body>
</html>
